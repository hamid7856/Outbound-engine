[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stackradar"
dynamic = ["version"]
description = "Spots companies that newly adopt Zendesk, Intercom, Gorgias or HubSpot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "dnspython>=2.6,<3",
]

[project.urls]
Repository = "https://github.com/hamid7856/Outbound-engine"
Issues = "https://github.com/hamid7856/Outbound-engine/issues"
Changelog = "https://github.com/hamid7856/Outbound-engine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
stackradar = "stackradar.cli:main"

[tool.setuptools.dynamic]
version = { attr = "stackradar.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
