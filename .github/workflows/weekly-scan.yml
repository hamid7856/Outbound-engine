name: Weekly scan

# Code lives on `main`. Scan results live on the `scan-results` branch so that
# weekly data commits never clutter the code history or pull requests.

on:
  schedule:
    - cron: "17 1 * * 1" # every Monday 01:17 UTC (06:17 PKT)
  workflow_dispatch:
    inputs:
      tranco_top:
        description: "Tranco top sites to scan (0 = only your own lists)"
        default: "50000"
      refresh_tranco:
        description: "Re-download the Tranco list (true/false)"
        default: "false"
      limit:
        description: "Scan only N domains (0 = all). Use 300 for a quick test."
        default: "0"

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Self-test
        run: pytest -q

      - name: Check out results branch
        run: |
          git config user.name "stackradar-bot"
          git config user.email "stackradar-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin scan-results >/dev/null; then
            git fetch --depth=1 origin +refs/heads/scan-results:refs/remotes/origin/scan-results
            git worktree add -B scan-results results origin/scan-results
          else
            echo "First run: creating scan-results branch"
            git worktree add --detach results
            cd results
            git checkout --orphan scan-results
            git rm -rfq .
            printf '# StackRadar scan results\n\nWritten automatically by the Weekly scan workflow. Do not edit by hand.\nStart with `data/latest_new_adopters.csv`. Column meanings: see docs/output-files.md on main.\n' > README.md
          fi

      - name: Scan
        env:
          TRANCO_TOP: ${{ github.event.inputs.tranco_top || '50000' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          REFRESH: ${{ github.event.inputs.refresh_tranco || 'false' }}
        run: |
          ARGS="--data-dir results/data --domains-dir domains --tranco-top $TRANCO_TOP --limit $LIMIT --max-minutes 300"
          if [ "$REFRESH" = "true" ]; then ARGS="$ARGS --refresh-tranco"; fi
          stackradar $ARGS | tee scan.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 scan.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save results
        working-directory: results
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Scan results $(date -u +%F) (stackradar ${GITHUB_SHA::7})"
          git push origin HEAD:scan-results
